# Native Windows ARM64 Nim prefixes for reprobuild's windows-aarch64 leg.
#
# reprobuild-pm spec/Distribution-And-Packaging.md §7.1, decision W2 (approved
# by Zahary Karadjov, 2026-11-16). nim-lang publishes no Windows ARM64 archive
# and csources_v3 carries no windows/arm64 C code, so each prefix is made in
# three steps, none of which runs an emulated image:
#
#   1. seed: on a native x64 host, the pinned x64 compiler of the SAME source
#      generates the compiler's C sources for --os:windows --cpu:arm64 from
#      that source's own lib/ (koch boot's iteration 1, retargeted). The seed
#      is text; its generator never runs on the ARM host.
#   2. prefix (Windows ARM64): llvm-mingw compiles the seed into nim.exe, koch
#      boot rebuilds it natively until two iterations are byte-identical,
#      koch zip assembles the distribution, and smokes qualify it.
#   3. publish (factory branch only, on Windows ARM64 like step 2, per the
#      spec's step 3): the qualified ZIPs become release assets, with their
#      sha256 in SHA256SUMS and, in each published receipt and the release
#      notes, the run, attempt and job that produced the ZIP.
#
# Why the seed is generated on Windows x64 rather than Linux (amended
# 2026-11-16 while implementing; the approved text says Linux): no Linux pool
# serves this repository (reprobuild-pm issue
# 2026-11-04-metacraft-labs-nim-ci-requests-runner-labels-no-pool-serves),
# while the persistent Windows x64 runners do. The property W2 needs -- text
# generated by a pinned compiler of the same source, not by an emulated
# image -- holds either way.
#
# A push of the factory branch builds, qualifies and publishes; a push of the
# probe branch builds and qualifies only (on the hosted image, reusing seeds).
#
# A workflow_dispatch on the factory branch with `publish_from_run` builds
# nothing: it publishes the two prefix ZIPs an earlier run of this workflow on
# this branch built and qualified. It exists because a build's own publish job
# can be lost (run 43908894254's first publish job asked for a Linux pool that
# does not serve this repository, see below) and rebuilding to publish would
# change the ZIPs' bytes -- each build stamps its date into nim.exe, so the
# sha256 differs between builds even though `koch boot` reaches a fixpoint.
# The path refuses a run of any other workflow or branch, a run without a
# successful prefix job for both labels, and any ZIP whose sha256 differs from
# its receipt's zipSha256.
#
# One prefix per Nim that reprobuild's x64 leg uses, so the two legs never run
# different compilers: the cold start's NIM_VERSION (upstream v2.2.8, the
# official nim-2.2.8_x64.zip), and the engine's bootstrap Nim (this fork's
# 2.2.10 maintenance source, the x64 nim-2.2.10-vccexe-8910b50d prefix).
name: Windows ARM64 Nim prefix

on:
  push:
    branches:
      - factory/windows-arm64-prefix
      - factory/windows-arm64-prefix-probe
    paths:
      - .github/workflows/windows-arm64-prefix.yml
      - scripts/windows-arm64-prefix.ps1
  workflow_dispatch:
    inputs:
      publish_from_run:
        description: >-
          Publish the prefix ZIPs of this earlier run of this workflow on the
          factory branch, instead of building.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-arm64-prefix-${{ github.ref }}
  cancel-in-progress: false

env:
  # Probe branch only: the probe reuses the seeds this earlier run generated
  # (the x64 runners queue), so its seed job is skipped. The factory branch
  # always generates its own seeds.
  REUSE_SEED_RUN: "43889125817"
  # W1: the windows-aarch64 C compiler, the same pin as reprobuild's
  # LLVM_MINGW_WIN_ARM64_* in windows/toolchain-versions.env.
  LLVM_MINGW_RELEASE: "20261104"
  LLVM_MINGW_SHA256: 7d7f8387a8706639b0b47a629d6e23f8b3ef9acce67e9832b8cd4c5bb2816eab

jobs:
  seed:
    name: Seed ${{ matrix.label }} (Windows x64, windows/arm64 C)
    if: github.event_name == 'push' && github.ref_name == 'factory/windows-arm64-prefix'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: nim-2.2.8
            repo: https://github.com/nim-lang/Nim.git
            commit: 4f500679b196fad944caa50a753f5bbfaefda001 # tag v2.2.8
            version: 2.2.8
            # The official x64 archive of the same release.
            generator: https://nim-lang.org/download/nim-2.2.8_x64.zip
            generator_sha256: 11fe2415a64a791b899cc78e2eeacdde93b5f122f2fabc447db36d38002bfb8c
          - label: nim-2.2.10-vccexe-8910b50d
            repo: https://github.com/metacraft-labs/nim.git
            commit: 8910b50d2d21ca1a3e982fe8b8b9bf0d8832e633
            version: 2.2.10
            # The x64 maintenance prefix of the same commit.
            generator: https://github.com/metacraft-labs/nim/releases/download/nim-2.2.10-vccexe-8910b50d2d21ca1a3e982fe8b8b9bf0d8832e633/nim-2.2.10-vccexe-8910b50d2d21ca1a3e982fe8b8b9bf0d8832e633-windows-x64.zip
            generator_sha256: e6eaf87df71f83629a8877ac496bcd8cdb7755f9e860b982bb0b886e38eac1c3
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Generate the seed
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $PSNativeCommandUseErrorActionPreference = $false
          $root = Join-Path $env:RUNNER_TEMP 'seed-${{ matrix.label }}'
          if (Test-Path $root) { Remove-Item -Recurse -Force $root }
          New-Item -ItemType Directory -Force $root | Out-Null
          $zip = Join-Path $root 'generator.zip'
          Invoke-WebRequest -Uri '${{ matrix.generator }}' -OutFile $zip
          $sha = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($sha -ne '${{ matrix.generator_sha256 }}') { throw "generator sha256 $sha does not match the pin" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::ExtractToDirectory($zip, (Join-Path $root 'generator'))
          $nim = Get-ChildItem -Recurse -Filter nim.exe (Join-Path $root 'generator') | Where-Object { $_.Directory.Name -eq 'bin' } | Select-Object -First 1
          $genVersion = & $nim.FullName --version | Out-String
          if ($genVersion -notmatch 'Nim Compiler Version ${{ matrix.version }} \[Windows: amd64\]') { throw "generator is not Nim ${{ matrix.version }} for amd64: $genVersion" }
          $src = Join-Path $root 'src'
          git init -q $src
          git -C $src fetch -q --depth 1 '${{ matrix.repo }}' '${{ matrix.commit }}'
          git -C $src checkout -q FETCH_HEAD
          if ((git -C $src rev-parse HEAD).Trim() -ne '${{ matrix.commit }}') { throw 'source is not the pinned commit' }
          $checksums = ([regex]::Match((Get-Content -Raw (Join-Path $src 'koch.nim')), 'ChecksumsStableCommit = "([0-9a-f]{40})"')).Groups[1].Value
          if (-not $checksums) { throw 'no ChecksumsStableCommit in koch.nim' }
          git clone -q https://github.com/nim-lang/checksums.git (Join-Path $src 'dist/checksums')
          git -C (Join-Path $src 'dist/checksums') checkout -q $checksums
          $seed = Join-Path $root 'seed'
          # koch boot's iteration-1 options, retargeted, against the source's lib.
          Push-Location $src
          & $nim.FullName c --compileOnly --genScript --os:windows --cpu:arm64 --cc:gcc `
            -d:release --skipUserCfg --skipParentCfg -d:nimKochBootstrap --hints:off `
            "--lib:$(Join-Path $src 'lib')" "--nimcache:$seed" compiler/nim.nim
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "seed generation failed with exit code $code" }
          if (-not (Test-Path (Join-Path $seed 'compile_nim.bat'))) { throw 'no compile_nim.bat' }
          Set-Content -LiteralPath (Join-Path $seed 'SOURCE_ROOT') -Value $src -Encoding ascii
          @("repo=${{ matrix.repo }}", "commit=${{ matrix.commit }}", "version=${{ matrix.version }}",
            "checksums=$checksums", "generator=${{ matrix.generator }}",
            "generator_sha256=${{ matrix.generator_sha256 }}") |
            Set-Content -LiteralPath (Join-Path $seed 'SEED_SOURCE') -Encoding ascii
          $tgz = Join-Path $env:RUNNER_TEMP '${{ matrix.label }}-seed.tgz'
          & "$env:SystemRoot\System32\tar.exe" -czf $tgz -C $root seed
          if ($LASTEXITCODE -ne 0) { throw 'packing the seed failed' }
          Get-FileHash -Algorithm SHA256 $tgz | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}-seed
          path: ${{ runner.temp }}/${{ matrix.label }}-seed.tgz
          if-no-files-found: error
          retention-days: 7

  prefix:
    name: Prefix ${{ matrix.label }} (Windows ARM64)
    needs: seed
    if: ${{ !cancelled() && github.event_name == 'push' && (needs.seed.result == 'success' || needs.seed.result == 'skipped') }}
    # The factory branch builds on the fleet's Windows-ARM class. The probe
    # branch exists only while that class is down (2026-11-16, m3 GARM
    # stopped) and uses GitHub's hosted windows-11-arm image -- a documented
    # exception per metacraft-dev-guidelines ci-workflow-standards.md: named
    # leg "Windows ARM64 Nim prefix (probe)", owner the windows-aarch64 leg
    # (reprobuild-pm Distribution-And-Packaging.md §7.1), follow-up: delete the
    # probe branch once eph-win-arm64 builds the factory branch. Nothing the
    # probe builds is published.
    runs-on: ${{ github.ref_name == 'factory/windows-arm64-prefix' && fromJSON('["self-hosted","windows","arm64"]') || 'windows-11-arm' }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: nim-2.2.8
            repo: https://github.com/nim-lang/Nim.git
            commit: 4f500679b196fad944caa50a753f5bbfaefda001
            version: 2.2.8
          - label: nim-2.2.10-vccexe-8910b50d
            repo: https://github.com/metacraft-labs/nim.git
            commit: 8910b50d2d21ca1a3e982fe8b8b9bf0d8832e633
            version: 2.2.10
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          path: factory
          persist-credentials: false
      - name: Which run's seeds
        id: seedrun
        run: |
          $id = if ($env:GITHUB_REF_NAME -ne 'factory/windows-arm64-prefix' -and $env:REUSE_SEED_RUN) { $env:REUSE_SEED_RUN } else { $env:GITHUB_RUN_ID }
          "id=$id" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "seeds from run $id"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.label }}-seed
          path: ${{ runner.temp }}/seed-artifact
          run-id: ${{ steps.seedrun.outputs.id }}
          github-token: ${{ github.token }}
      - name: Build and qualify
        run: |
          & ./factory/scripts/windows-arm64-prefix.ps1 `
            -Label '${{ matrix.label }}' -Repo '${{ matrix.repo }}' `
            -Commit '${{ matrix.commit }}' -Version '${{ matrix.version }}' `
            -SeedArchive (Join-Path $env:RUNNER_TEMP 'seed-artifact/${{ matrix.label }}-seed.tgz') `
            -LlvmMingwRelease $env:LLVM_MINGW_RELEASE -LlvmMingwSha256 $env:LLVM_MINGW_SHA256 `
            -WorkRoot (Join-Path $env:RUNNER_TEMP 'w') `
            -Evidence (Join-Path $env:GITHUB_WORKSPACE 'evidence') `
            -FactoryRevision '${{ github.sha }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.label }}-windows-arm64
          path: evidence/
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish (factory branch only)
    needs: prefix
    # Push: after this run's prefix jobs succeed. Dispatch: the prefix jobs are
    # skipped, and the ZIPs come from the run named by publish_from_run.
    if: >-
      ${{ !cancelled() && github.ref_name == 'factory/windows-arm64-prefix' &&
      ((github.event_name == 'push' && needs.prefix.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_from_run != '')) }}
    # On eph-win-arm64, as the spec's step 3 places publication (reprobuild-pm
    # Distribution-And-Packaging.md §7.1, W2). Not [self-hosted, linux, x64]:
    # no Linux pool serves this repository (reprobuild-pm issue
    # 2026-11-04-metacraft-labs-nim-ci-requests-runner-labels-no-pool-serves),
    # and run 43908894254's publish job waited on that label indefinitely.
    runs-on: [self-hosted, windows, arm64]
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      LABELS: nim-2.2.8 nim-2.2.10-vccexe-8910b50d
    steps:
      - name: Resolve and check the producing run
        id: source
        env:
          FROM_RUN: ${{ inputs.publish_from_run }}
        run: |
          $ErrorActionPreference = 'Stop'
          $api = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY"
          $h = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          # Every GitHub REST call goes through Invoke-GitHub: on an HTTP error it
          # logs the status, the full response body and the permission headers
          # GitHub returns (x-accepted-github-permissions names what a 403 needed),
          # then throws. Invoke-RestMethod's own error display truncates the body.
          function Invoke-GitHub([string]$Method = 'Get', [string]$Uri, $Body = $null, [string]$ContentType = 'application/json', [string]$InFile = '', [int[]]$Allow = @()) {
            $p = @{ Method = $Method; Uri = $Uri; Headers = $h; SkipHttpErrorCheck = $true; StatusCodeVariable = 'sc'; ResponseHeadersVariable = 'rh' }
            if ($null -ne $Body) { $p.Body = $Body; $p.ContentType = $ContentType }
            if ($InFile) { $p.InFile = $InFile; $p.ContentType = $ContentType }
            $resp = Invoke-RestMethod @p
            if ($sc -ge 400 -and $Allow -notcontains $sc) {
              Write-Host "GitHub API $Method $Uri -> HTTP $sc"
              foreach ($k in 'x-accepted-github-permissions', 'x-oauth-scopes', 'x-github-request-id') { if ($rh -and $rh[$k]) { Write-Host "  ${k}: $($rh[$k] -join ', ')" } }
              Write-Host ('  body: ' + $(if ($resp -is [string]) { $resp } else { $resp | ConvertTo-Json -Depth 8 -Compress }))
              throw "GitHub API $Method $Uri failed with HTTP $sc"
            }
            return [pscustomobject]@{ Status = $sc; Body = $resp }
          }
          $runId = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $env:FROM_RUN.Trim() } else { $env:GITHUB_RUN_ID }
          if ($runId -notmatch '^[0-9]+$') { throw "publish_from_run is not a run id: '$runId'" }
          $run = (Invoke-GitHub -Uri "$api/actions/runs/$runId").Body
          # Only a run of this same workflow on this same branch.
          if ($run.path -ne '.github/workflows/windows-arm64-prefix.yml') { throw "run $runId is workflow '$($run.path)', not windows-arm64-prefix.yml" }
          if ($run.head_branch -ne 'factory/windows-arm64-prefix') { throw "run $runId is on branch '$($run.head_branch)', not factory/windows-arm64-prefix" }
          if ($run.head_repository.full_name -ne $env:GITHUB_REPOSITORY) { throw "run $runId is from $($run.head_repository.full_name)" }
          # Every attempt's jobs: a prefix job that succeeded in an earlier
          # attempt is carried, not re-run, by later ones.
          $jobs = @()
          $page = 1
          do {
            $r = (Invoke-GitHub -Uri "$api/actions/runs/$runId/jobs?filter=all&per_page=100&page=$page").Body
            $jobs += $r.jobs
            $page++
          } while ($r.jobs.Count -eq 100)
          $provenance = [ordered]@{ repository = $env:GITHUB_REPOSITORY; run = [long]$runId; headSha = $run.head_sha; prefixes = [ordered]@{} }
          foreach ($label in $env:LABELS.Split(' ')) {
            $ok = @($jobs | Where-Object { $_.name -eq "Prefix $label (Windows ARM64)" -and $_.conclusion -eq 'success' } | Sort-Object completed_at -Descending)
            if ($ok.Count -eq 0) { throw "run $runId has no successful prefix job for $label" }
            $j = $ok[0]
            $provenance.prefixes[$label] = [ordered]@{ run = [long]$runId; attempt = [int]$j.run_attempt; jobId = [long]$j.id; jobUrl = $j.html_url; runner = $j.runner_name; completedAt = $j.completed_at }
            "$label <- run $runId attempt $($j.run_attempt) job $($j.id) on $($j.runner_name)"
          }
          New-Item -ItemType Directory -Force out | Out-Null
          $provenance | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 out/PROVENANCE.json
          "run=$runId" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sha=$($run.head_sha)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-windows-arm64'
          path: prefixes
          run-id: ${{ steps.source.outputs.run }}
          github-token: ${{ github.token }}
      - name: Verify the ZIPs against their receipts and create the release
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $api = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY"
          $h = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          # Every GitHub REST call goes through Invoke-GitHub: on an HTTP error it
          # logs the status, the full response body and the permission headers
          # GitHub returns (x-accepted-github-permissions names what a 403 needed),
          # then throws. Invoke-RestMethod's own error display truncates the body.
          function Invoke-GitHub([string]$Method = 'Get', [string]$Uri, $Body = $null, [string]$ContentType = 'application/json', [string]$InFile = '', [int[]]$Allow = @()) {
            $p = @{ Method = $Method; Uri = $Uri; Headers = $h; SkipHttpErrorCheck = $true; StatusCodeVariable = 'sc'; ResponseHeadersVariable = 'rh' }
            if ($null -ne $Body) { $p.Body = $Body; $p.ContentType = $ContentType }
            if ($InFile) { $p.InFile = $InFile; $p.ContentType = $ContentType }
            $resp = Invoke-RestMethod @p
            if ($sc -ge 400 -and $Allow -notcontains $sc) {
              Write-Host "GitHub API $Method $Uri -> HTTP $sc"
              foreach ($k in 'x-accepted-github-permissions', 'x-oauth-scopes', 'x-github-request-id') { if ($rh -and $rh[$k]) { Write-Host "  ${k}: $($rh[$k] -join ', ')" } }
              Write-Host ('  body: ' + $(if ($resp -is [string]) { $resp } else { $resp | ConvertTo-Json -Depth 8 -Compress }))
              throw "GitHub API $Method $Uri failed with HTTP $sc"
            }
            return [pscustomobject]@{ Status = $sc; Body = $resp }
          }
          $prov = Get-Content -Raw out/PROVENANCE.json | ConvertFrom-Json
          $assets = @()
          $sums = @()
          $lines = @()
          foreach ($label in $env:LABELS.Split(' ')) {
            $dir = Join-Path prefixes "$label-windows-arm64"
            $zips = @(Get-ChildItem -LiteralPath $dir -Filter '*-windows-arm64.zip' -File)
            if ($zips.Count -ne 1) { throw "${label}: expected one ZIP in $dir, found $($zips.Count)" }
            $receiptPath = Join-Path $dir "receipt-$label.json"
            $receipt = Get-Content -Raw -LiteralPath $receiptPath | ConvertFrom-Json
            if ($receipt.label -ne $label) { throw "${label}: receipt names label '$($receipt.label)'" }
            if ($receipt.zip -ne $zips[0].Name) { throw "${label}: receipt names '$($receipt.zip)', artifact holds '$($zips[0].Name)'" }
            if ($receipt.factoryRevision -ne $env:SOURCE_SHA) { throw "${label}: receipt factoryRevision $($receipt.factoryRevision) is not the run's head $env:SOURCE_SHA" }
            $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $zips[0].FullName).Hash.ToLowerInvariant()
            if ($sha -ne $receipt.zipSha256) { throw "${label}: ZIP sha256 $sha does not match the receipt's zipSha256 $($receipt.zipSha256)" }
            $p = $prov.prefixes.$label
            $receipt | Add-Member -NotePropertyName producedBy -NotePropertyValue ([ordered]@{
              repository = $prov.repository; run = $p.run; attempt = $p.attempt; jobId = $p.jobId; jobUrl = $p.jobUrl; runner = $p.runner })
            New-Item -ItemType Directory -Force out | Out-Null
            $receiptOut = Join-Path out "receipt-$label.json"
            $receipt | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 $receiptOut
            $assets += $zips[0].FullName, (Resolve-Path $receiptOut).Path
            $sums += "$sha  $($zips[0].Name)"
            $lines += "- ``$($zips[0].Name)``: sha256 ``$sha``, built by run $($p.run) attempt $($p.attempt), job $($p.jobId) on ``$($p.runner)``."
          }
          $sums | Set-Content -Encoding ascii out/SHA256SUMS
          $assets += (Resolve-Path out/SHA256SUMS).Path, (Resolve-Path out/PROVENANCE.json).Path
          $short = $env:SOURCE_SHA.Substring(0, 12)
          $tag = "nim-windows-arm64-prefixes-$short"
          if ((Invoke-GitHub -Uri "$api/releases/tags/$tag" -Allow 404).Status -ne 404) { throw "release $tag already exists" }
          $tagRef = Invoke-GitHub -Uri "$api/git/ref/tags/$tag" -Allow 404
          "tag ${tag}: $(if ($tagRef.Status -eq 404) { 'absent; the release creates it at ' + $env:SOURCE_SHA } else { 'exists at ' + $tagRef.Body.object.sha })"
          if ($tagRef.Status -ne 404 -and $tagRef.Body.object.sha -ne $env:SOURCE_SHA) { throw "tag $tag exists at $($tagRef.Body.object.sha), not $env:SOURCE_SHA" }
          # A tag that already exists here was created by hand: GITHUB_TOKEN can
          # never hold the `workflows` permission, and GitHub refuses it a ref
          # whose tree changes .github/workflows/ against the default branch,
          # which every factory revision on this branch does (run 44454493957's
          # create-release call failed with 403 for this reason). Say so in the
          # provenance and the notes rather than let the tag read as the job's.
          $tagNote = ''
          if ($tagRef.Status -ne 404) {
            $tagNote = "The tag $tag was created by hand at $env:SOURCE_SHA before this run, not by this job: GITHUB_TOKEN cannot create a ref whose tree changes workflow files (it never holds the workflows permission), and this factory revision's tree does. The ZIPs, their checksums and their verification against the receipts are this job's."
            $provJson = Get-Content -Raw out/PROVENANCE.json | ConvertFrom-Json
            $provJson | Add-Member -NotePropertyName tag -NotePropertyValue ([ordered]@{ name = $tag; sha = $env:SOURCE_SHA; createdBy = 'hand, before the publishing run'; reason = 'GITHUB_TOKEN cannot create a ref whose tree changes workflow files' })
            $provJson | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 out/PROVENANCE.json
          }
          $body = @(
            "Native Windows ARM64 Nim prefixes from factory revision $env:SOURCE_SHA. Each was compiled on eph-win-arm64 with llvm-mingw $env:LLVM_MINGW_RELEASE from a seed that the pinned x64 compiler of the same source generated on Windows x64, rebuilt by koch boot to a byte-identical fixpoint, and qualified natively. Published by run $env:GITHUB_RUN_ID ($env:GITHUB_EVENT_NAME).",
            ''
          ) + $lines + @(
            '',
            'Each receipt-*.json records the build steps and, under producedBy, the run, attempt and job that built its ZIP; PROVENANCE.json lists the same for both.'
          ) + $(if ($tagNote) { @('', $tagNote) } else { @() }) -join "`n"
          $rel = (Invoke-GitHub -Method Post -Uri "$api/releases" -Body (@{
            tag_name = $tag; target_commitish = $env:SOURCE_SHA; name = "Nim Windows ARM64 prefixes ($short)"; body = $body } | ConvertTo-Json)).Body
          $upload = $rel.upload_url -replace '\{.*\}$', ''
          foreach ($a in $assets) {
            $name = [IO.Path]::GetFileName($a)
            $r = (Invoke-GitHub -Method Post -Uri "$upload`?name=$([uri]::EscapeDataString($name))" -ContentType 'application/octet-stream' -InFile $a).Body
            "uploaded $($r.name) $($r.size) $($r.browser_download_url)"
          }
          Get-Content out/SHA256SUMS

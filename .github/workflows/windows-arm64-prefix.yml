# Native Windows ARM64 Nim prefixes for reprobuild's windows-aarch64 leg.
#
# reprobuild-pm spec/Distribution-And-Packaging.md §7.1, decision W2 (approved
# by Zahary Karadjov, 2026-11-16). nim-lang publishes no Windows ARM64 archive
# and csources_v3 carries no windows/arm64 C code, so each prefix is made in
# three steps, none of which runs an emulated image:
#
#   1. seed: on a native x64 host, the pinned x64 compiler of the SAME source
#      generates the compiler's C sources for --os:windows --cpu:arm64 from
#      that source's own lib/ (koch boot's iteration 1, retargeted). The seed
#      is text; its generator never runs on the ARM host.
#   2. prefix (Windows ARM64): llvm-mingw compiles the seed into nim.exe, koch
#      boot rebuilds it natively until two iterations are byte-identical,
#      koch zip assembles the distribution, and smokes qualify it
#      (scripts/windows-arm64-prefix.ps1).
#   3. publish (producer tag only, on Windows ARM64 like step 2, per the
#      spec's step 3): the qualified ZIPs become release assets, with their
#      sha256 in SHA256SUMS and, in each published receipt and the release
#      notes, the run, attempt and job that produced the ZIP
#      (scripts/windows-arm64-prefix-release.ps1).
#
# Why the seed is generated on Windows x64 rather than Linux (amended
# 2026-11-16 while implementing; the approved text says Linux): no Linux pool
# serves this repository (reprobuild-pm issue
# 2026-11-04-metacraft-labs-nim-ci-requests-runner-labels-no-pool-serves),
# while the persistent Windows x64 runners do. The property W2 needs -- text
# generated by a pinned compiler of the same source, not by an emulated
# image -- holds either way.
#
# One prefix per Nim that reprobuild's x64 leg uses, so the two legs never run
# different compilers: the cold start's NIM_VERSION (upstream v2.2.8, the
# official nim-2.2.8_x64.zip), and the engine's bootstrap Nim (this fork's
# 2.2.10 maintenance source, the x64 nim-2.2.10-vccexe-8910b50d prefix).
#
# ─────────────────────────────────────────────────────────────────────────────
# HOW TO CUT IT
#
# Prefixes are produced once per pin change and every later build consumes the
# pin, so the producer runs only when someone asks for it: pushing a producer
# tag is the request. Tag a commit that is already on `codetracer` and carries
# this file:
#
#   git tag -a producer/nim-windows-arm64-prefixes/build-1 <sha> \
#     -m "Nim Windows ARM64 prefixes, producer build 1"
#   git push origin producer/nim-windows-arm64-prefixes/build-1
#
# The tag is `producer/nim-windows-arm64-prefixes/build-<n>`, <n> = 1, 2, ...
# counting producer builds. A failed run is retried with the next <n>; an
# existing tag is never moved or reused. Every other workflow here with a push
# trigger names its branches, so a producer tag starts only this one; and a
# filter `*` never matches `/`
# (https://docs.github.com/actions/writing-workflows/workflow-syntax-for-github-actions#filter-pattern-cheat-sheet).
#
# WHAT IT PUBLISHES
#
# A prerelease (never "Latest", so releases/latest keeps naming the x64
# maintenance prefix) for the pushed tag, carrying, per label,
#   <label>-<first 12 hex of the source commit>-windows-arm64.zip
#   receipt-<label>.json
# and SHA256SUMS and PROVENANCE.json. reprobuild then pins a ZIP's URL and
# sha256 (NIM_WIN_ARM64_URL / NIM_WIN_ARM64_SHA256 in
# windows/toolchain-versions.env) in a separate commit; this workflow never
# edits a tree.
#
# WHY THE WORKFLOW NEVER CREATES THE TAG
#
# Run 44454493957 asked the releases API to create the tag at the factory
# revision with GITHUB_TOKEN and was refused (HTTP 403, reprobuild-pm issue
# 2026-11-19-nim-factory-github-token-cannot-create-the-windows-arm64-prefix-release-tag).
# A tag pushed with GITHUB_TOKEN would also start no workflow. So, as the
# operator decided for reprobuild's clingo producer on 2026-11-24, a person or a
# session pushes the tag with its own credentials, the tag push starts this
# run, and the run's only write is a release for that existing tag:
# `gh release create --verify-tag` refuses when the tag is not already on the
# remote, so it can never create one. No App token and no new secret.
#
# THE GUARDS. `admit` runs before the scarce builds and refuses a tag of the
# wrong shape, a commit not on `codetracer` (so an arbitrary tag cannot publish
# a compiler built by unreviewed factory code), a tag that no longer names the
# run's commit, or a tag that already has a release. `publish` repeats the last
# two, refuses an asset name another producer release already carries, and
# checks the tag still names the built commit before and after uploading.
#
# workflow_dispatch is a build-only dry run from any branch: it seeds, builds
# and qualifies, uploads the run artifacts, and never publishes (`publish` runs
# only on a tag push).
# ─────────────────────────────────────────────────────────────────────────────
name: Windows ARM64 Nim prefix

on:
  push:
    tags:
      - "producer/nim-windows-arm64-prefixes/build-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-arm64-prefix-${{ github.ref }}
  cancel-in-progress: false

env:
  # W1: the windows-aarch64 C compiler, the same pin as reprobuild's
  # LLVM_MINGW_WIN_ARM64_* in windows/toolchain-versions.env.
  LLVM_MINGW_RELEASE: "20261104"
  LLVM_MINGW_SHA256: 7d7f8387a8706639b0b47a629d6e23f8b3ef9acce67e9832b8cd4c5bb2816eab
  # The branch a producer tag's commit must be on.
  PRODUCER_SOURCE_BRANCH: codetracer
  # The labels the publish job expects one qualified ZIP for, in matrix order.
  LABELS: nim-2.2.8 nim-2.2.10-vccexe-8910b50d

jobs:
  admit:
    name: Admit the producer tag
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/producer/nim-windows-arm64-prefixes/')
    # The persistent Windows x64 runners, which the seed job uses next: no
    # Linux pool serves this repository (see the header).
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Refuse a tag that is not a producer build tag
        run: . ./scripts/windows-arm64-prefix-release.ps1; $null = Assert-ProducerTag -Tag $env:GITHUB_REF_NAME
      - name: Refuse a commit that is not on the producer source branch
        run: . ./scripts/windows-arm64-prefix-release.ps1; Assert-CommitOnBranch -Remote "https://github.com/$env:GITHUB_REPOSITORY.git" -Branch $env:PRODUCER_SOURCE_BRANCH -Commit $env:GITHUB_SHA
      - name: Refuse if the tag no longer names this commit
        run: . ./scripts/windows-arm64-prefix-release.ps1; Assert-TagNamesCommit -Remote "https://github.com/$env:GITHUB_REPOSITORY.git" -Tag $env:GITHUB_REF_NAME -Commit $env:GITHUB_SHA
      - name: Refuse if a release for this tag already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: . ./scripts/windows-arm64-prefix-release.ps1; $null = Install-PinnedGh -WorkRoot (Join-Path $env:RUNNER_TEMP 'gh'); Assert-NoRelease -Repository $env:GITHUB_REPOSITORY -Tag $env:GITHUB_REF_NAME

  seed:
    name: Seed ${{ matrix.label }} (Windows x64, windows/arm64 C)
    needs: admit
    # A tag push seeds only once `admit` passed; a dispatch has no `admit` (it
    # is skipped) and seeds unconditionally, publishing nothing.
    if: >-
      !cancelled() &&
      (needs.admit.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && needs.admit.result == 'skipped'))
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: nim-2.2.8
            repo: https://github.com/nim-lang/Nim.git
            commit: 4f500679b196fad944caa50a753f5bbfaefda001 # tag v2.2.8
            version: 2.2.8
            # The official x64 archive of the same release.
            generator: https://nim-lang.org/download/nim-2.2.8_x64.zip
            generator_sha256: 11fe2415a64a791b899cc78e2eeacdde93b5f122f2fabc447db36d38002bfb8c
          - label: nim-2.2.10-vccexe-8910b50d
            repo: https://github.com/metacraft-labs/nim.git
            commit: 8910b50d2d21ca1a3e982fe8b8b9bf0d8832e633
            version: 2.2.10
            # The x64 maintenance prefix of the same commit.
            generator: https://github.com/metacraft-labs/nim/releases/download/nim-2.2.10-vccexe-8910b50d2d21ca1a3e982fe8b8b9bf0d8832e633/nim-2.2.10-vccexe-8910b50d2d21ca1a3e982fe8b8b9bf0d8832e633-windows-x64.zip
            generator_sha256: e6eaf87df71f83629a8877ac496bcd8cdb7755f9e860b982bb0b886e38eac1c3
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Generate the seed
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $PSNativeCommandUseErrorActionPreference = $false
          $root = Join-Path $env:RUNNER_TEMP 'seed-${{ matrix.label }}'
          if (Test-Path $root) { Remove-Item -Recurse -Force $root }
          New-Item -ItemType Directory -Force $root | Out-Null
          $zip = Join-Path $root 'generator.zip'
          Invoke-WebRequest -Uri '${{ matrix.generator }}' -OutFile $zip
          $sha = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($sha -ne '${{ matrix.generator_sha256 }}') { throw "generator sha256 $sha does not match the pin" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::ExtractToDirectory($zip, (Join-Path $root 'generator'))
          $nim = Get-ChildItem -Recurse -Filter nim.exe (Join-Path $root 'generator') | Where-Object { $_.Directory.Name -eq 'bin' } | Select-Object -First 1
          $genVersion = & $nim.FullName --version | Out-String
          if ($genVersion -notmatch 'Nim Compiler Version ${{ matrix.version }} \[Windows: amd64\]') { throw "generator is not Nim ${{ matrix.version }} for amd64: $genVersion" }
          $src = Join-Path $root 'src'
          git init -q $src
          git -C $src fetch -q --depth 1 '${{ matrix.repo }}' '${{ matrix.commit }}'
          git -C $src checkout -q FETCH_HEAD
          if ((git -C $src rev-parse HEAD).Trim() -ne '${{ matrix.commit }}') { throw 'source is not the pinned commit' }
          $checksums = ([regex]::Match((Get-Content -Raw (Join-Path $src 'koch.nim')), 'ChecksumsStableCommit = "([0-9a-f]{40})"')).Groups[1].Value
          if (-not $checksums) { throw 'no ChecksumsStableCommit in koch.nim' }
          git clone -q https://github.com/nim-lang/checksums.git (Join-Path $src 'dist/checksums')
          git -C (Join-Path $src 'dist/checksums') checkout -q $checksums
          $seed = Join-Path $root 'seed'
          # koch boot's iteration-1 options, retargeted, against the source's lib.
          Push-Location $src
          & $nim.FullName c --compileOnly --genScript --os:windows --cpu:arm64 --cc:gcc `
            -d:release --skipUserCfg --skipParentCfg -d:nimKochBootstrap --hints:off `
            "--lib:$(Join-Path $src 'lib')" "--nimcache:$seed" compiler/nim.nim
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "seed generation failed with exit code $code" }
          if (-not (Test-Path (Join-Path $seed 'compile_nim.bat'))) { throw 'no compile_nim.bat' }
          Set-Content -LiteralPath (Join-Path $seed 'SOURCE_ROOT') -Value $src -Encoding ascii
          @("repo=${{ matrix.repo }}", "commit=${{ matrix.commit }}", "version=${{ matrix.version }}",
            "checksums=$checksums", "generator=${{ matrix.generator }}",
            "generator_sha256=${{ matrix.generator_sha256 }}") |
            Set-Content -LiteralPath (Join-Path $seed 'SEED_SOURCE') -Encoding ascii
          $tgz = Join-Path $env:RUNNER_TEMP '${{ matrix.label }}-seed.tgz'
          & "$env:SystemRoot\System32\tar.exe" -czf $tgz -C $root seed
          if ($LASTEXITCODE -ne 0) { throw 'packing the seed failed' }
          Get-FileHash -Algorithm SHA256 $tgz | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}-seed
          path: ${{ runner.temp }}/${{ matrix.label }}-seed.tgz
          if-no-files-found: error
          retention-days: 7

  prefix:
    name: Prefix ${{ matrix.label }} (Windows ARM64)
    needs: seed
    if: ${{ !cancelled() && needs.seed.result == 'success' }}
    # The fleet's Windows-ARM class (eph-win-arm64), for a tag and a dry run
    # alike. The hosted windows-11-arm probe that stood in while that class was
    # down (2026-11-16) is gone: the class built both prefixes in run
    # 43908894254, which was the probe exception's stated end.
    runs-on: [self-hosted, windows, arm64]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: nim-2.2.8
            repo: https://github.com/nim-lang/Nim.git
            commit: 4f500679b196fad944caa50a753f5bbfaefda001
            version: 2.2.8
          - label: nim-2.2.10-vccexe-8910b50d
            repo: https://github.com/metacraft-labs/nim.git
            commit: 8910b50d2d21ca1a3e982fe8b8b9bf0d8832e633
            version: 2.2.10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          path: factory
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.label }}-seed
          path: ${{ runner.temp }}/seed-artifact
      - name: Build and qualify
        run: |
          & ./factory/scripts/windows-arm64-prefix.ps1 `
            -Label '${{ matrix.label }}' -Repo '${{ matrix.repo }}' `
            -Commit '${{ matrix.commit }}' -Version '${{ matrix.version }}' `
            -SeedArchive (Join-Path $env:RUNNER_TEMP 'seed-artifact/${{ matrix.label }}-seed.tgz') `
            -LlvmMingwRelease $env:LLVM_MINGW_RELEASE -LlvmMingwSha256 $env:LLVM_MINGW_SHA256 `
            -WorkRoot (Join-Path $env:RUNNER_TEMP 'w') `
            -Evidence (Join-Path $env:GITHUB_WORKSPACE 'evidence') `
            -FactoryRevision '${{ github.sha }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.label }}-windows-arm64
          path: evidence/
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish (producer tag only)
    needs: [admit, prefix]
    # Only a tag push whose prefixes all qualified. A dispatch -- from a branch
    # or from a tag -- never reaches this job, and it is the only job holding
    # `contents: write`. A lost publish job is retried with "Re-run failed
    # jobs", which keeps this run's artifacts; rebuilding would change the
    # ZIPs' bytes (each build stamps its date into nim.exe).
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/producer/nim-windows-arm64-prefixes/') &&
      needs.admit.result == 'success' && needs.prefix.result == 'success'
    # On eph-win-arm64, as the spec's step 3 places publication. Not
    # [self-hosted, linux, x64]: no Linux pool serves this repository.
    runs-on: [self-hosted, windows, arm64]
    timeout-minutes: 30
    permissions:
      contents: write
      # The jobs API, for each ZIP's producing job in the provenance.
      actions: read
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      REMOTE: https://github.com/${{ github.repository }}.git
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-windows-arm64'
          path: prefixes
      - name: Install the pinned GitHub CLI
        run: . ./scripts/windows-arm64-prefix-release.ps1; $null = Install-PinnedGh -WorkRoot (Join-Path $env:RUNNER_TEMP 'gh')
      - name: Refuse if the tag no longer names this build (before upload)
        run: . ./scripts/windows-arm64-prefix-release.ps1; Assert-TagNamesCommit -Remote $env:REMOTE -Tag $env:TAG -Commit $env:GITHUB_SHA
      - name: Verify the ZIPs against their receipts and publish the release for the pushed tag
        run: |
          . ./scripts/windows-arm64-prefix-release.ps1
          $labels = $env:LABELS.Split(' ')
          Assert-NoRelease -Repository $env:GITHUB_REPOSITORY -Tag $env:TAG
          $provenance = Get-PrefixProvenance -Repository $env:GITHUB_REPOSITORY -RunId $env:GITHUB_RUN_ID -Labels $labels
          $bundle = New-PrefixReleaseBundle -PrefixesDir prefixes -OutDir out -Labels $labels `
            -SourceSha $env:GITHUB_SHA -Provenance $provenance -Tag $env:TAG
          Assert-AssetNamesUnpublished -Repository $env:GITHUB_REPOSITORY -Names ($bundle.Assets | Where-Object { $_ -like '*.zip' } | ForEach-Object { Split-Path -Leaf $_ })
          Publish-PrefixRelease -Repository $env:GITHUB_REPOSITORY -Tag $env:TAG -SourceSha $env:GITHUB_SHA `
            -Assets $bundle.Assets -Notes $bundle.Notes -WorkRoot (Join-Path $env:RUNNER_TEMP 'publish')
          Get-Content out/SHA256SUMS
      - name: Refuse if the tag no longer names this build (after publishing)
        id: tag_after_publish
        run: . ./scripts/windows-arm64-prefix-release.ps1; Assert-TagNamesCommit -Remote $env:REMOTE -Tag $env:TAG -Commit $env:GITHUB_SHA
      - name: Hide the release again, its tag moved while it was publishing
        if: failure() && steps.tag_after_publish.outcome == 'failure'
        run: |
          . ./scripts/windows-arm64-prefix-release.ps1
          Hide-PrefixRelease -Repository $env:GITHUB_REPOSITORY -Tag $env:TAG
          throw "Release $env:TAG was returned to draft: its tag no longer names $env:GITHUB_SHA, the commit its assets were built from."

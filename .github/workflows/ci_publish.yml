name: Tracking orc-booting compiler memory usage

on:
  pull_request_target:
    types: [closed]


jobs:
  build:
    # Toolchain comes from the repo flake dev shell materialised by
    # setup-dev-env (env-flavor: nix), replacing the apt-fast dependency
    # installs. Runs on the eph-linux-x64 Nix runner class (linux/x64).
    if: github.event.pull_request.merged == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            runner: eph-linux-x64
            cpu: amd64
    name: '${{ matrix.target }}'
    runs-on: ${{ matrix.runner }}
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: 'Mint installation token for cross-repo sibling clones'
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      # Clones .github/sibling-repos (codetracer-trace-format-nim,
      # nim-stew) at workspace-lock-pinned revisions and installs Nix +
      # the `dev-exec` wrapper (`nix develop --command`).
      - name: 'Setup dev env (nix flavor)'
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}

      # nim-results is on github.com/arnetheduck (not metacraft-labs);
      # clone it explicitly adjacent to the checkout so the flake
      # shellHook can link it into dist/nim-results.
      - name: 'Clone nim-results sibling (arnetheduck upstream)'
        shell: bash
        env:
          NIM_RESULTS_REV: b319652e98a198fa881ca70a76754c2dd6f09804
        run: |
          set -euo pipefail
          dest="$(cd "$GITHUB_WORKSPACE/.." && pwd)/nim-results"
          rm -rf "$dest"
          git clone --no-checkout https://github.com/arnetheduck/nim-results.git "$dest"
          git -C "$dest" fetch --depth 1 origin "$NIM_RESULTS_REV"
          git -C "$dest" checkout --detach FETCH_HEAD

      - name: 'Build csources + koch + Nim, run action (inside nix dev shell)'
        shell: bash
        run: |
          dev-exec bash -euo pipefail -c '
            . ci/funs.sh
            nimCiSystemInfo
            nimBuildCsourcesIfNeeded CC=gcc ucpu=${{ matrix.cpu }}
            export PATH="$PWD/bin:$PATH"
            nim c koch
            ./koch boot -d:release -d:nimStrictMode --lib:lib
            nim c -r -d:release ci/action.nim
          '

      - name: 'Comment'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');

            try {
              const data = fs.readFileSync('ci/nimcache/results.txt', 'utf8');
              github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: data
            })
            } catch (err) {
              console.error(err);
            }

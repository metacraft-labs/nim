name: Packages CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'devel'
      - 'version-2-2'
      - 'version-2-0'
      - 'version-1-6'
      - 'version-1-2'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Toolchain + testament system libraries (curl, boehmgc, openssl,
    # pcre, blas/lapack, SDL, sfml, valgrind, node, ...) come from the
    # repo flake dev shell materialised by setup-dev-env (env-flavor:
    # nix), replacing the apt-get/brew dependency installs. Runs on the
    # Nix runner classes: eph-linux-x64 (linux/x64) and eph-macos-arm64 (macOS/arm64).
    strategy:
      fail-fast: false
      matrix:
        batch: ["allowed_failures", "0_3", "1_3", "2_3"] # list of `index_num`
        target: [linux, osx]
        # `target` is a base matrix dimension (not include-only) so the
        # per-target runner/cpu below merge onto every batch combination:
        # an include entry that omits the base key would otherwise be
        # applied to every combination in list order, with `osx`
        # overwriting `linux` and dropping the Linux jobs entirely.
        include:
          - target: linux
            runner: eph-linux-x64
            cpu: amd64
          - target: osx
            runner: eph-macos-arm64
            cpu: arm64
    name: '${{ matrix.target }} (batch: ${{ matrix.batch }})'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60 # refs bug #18178
    env:
      NIM_TEST_PACKAGES: "1"
      NIM_TESTAMENT_BATCH: ${{ matrix.batch }}
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: 'Mint installation token for cross-repo sibling clones'
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      # Clones .github/sibling-repos (codetracer-trace-format-nim,
      # nim-stew) at workspace-lock-pinned revisions and installs Nix +
      # the `dev-exec` wrapper (`nix develop --command`).
      - name: 'Setup dev env (nix flavor)'
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}

      # nim-results is on github.com/arnetheduck (not metacraft-labs);
      # clone it explicitly adjacent to the checkout so the flake
      # shellHook can link it into dist/nim-results.
      - name: 'Clone nim-results sibling (arnetheduck upstream)'
        shell: bash
        env:
          NIM_RESULTS_REV: b319652e98a198fa881ca70a76754c2dd6f09804
        run: |
          set -euo pipefail
          dest="$(cd "$GITHUB_WORKSPACE/.." && pwd)/nim-results"
          rm -rf "$dest"
          git clone --no-checkout https://github.com/arnetheduck/nim-results.git "$dest"
          git -C "$dest" fetch --depth 1 origin "$NIM_RESULTS_REV"
          git -C "$dest" checkout --detach FETCH_HEAD

      - name: 'Build csources + koch, run packages CI (inside nix dev shell)'
        shell: bash
        run: |
          # shellcheck disable=SC2016 # The declared child Bash expands this script.
          dev-exec bash -euo pipefail -c '
            . ci/funs.sh
            nimCiSystemInfo
            nimBuildCsourcesIfNeeded CC=gcc ucpu=${{ matrix.cpu }}
            export PATH="$PWD/bin:$PATH"
            nimInternalBuildKochAndRunCI
          '

  vccexe-paths:
    name: 'MSVC wrapper source paths (Windows x64)'
    runs-on: [self-hosted, Windows, X64, dev-env-ready]
    defaults:
      run:
        working-directory: ci/vccexe
    env:
      REPRO_TOOL_PROVISIONING: tarball
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: 'Mint installation token'
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs
      - name: 'Setup declared regression tools'
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@387fee68b58afd2542695709eb2e6681b0cd9888
        with:
          env-flavor: reprobuild
          repro-version: v0.2.17
          consumer-directory: ci/vccexe
          workspace-directory: .
          gh-token: ${{ steps.ci_token.outputs.token }}
      - name: 'Build the owning wrapper and run native controls'
        shell: pwsh
        run: |
          # Bind the actual interpreter supplied by this workflow's pwsh shell.
          $powerShellImage = [Environment]::ProcessPath
          dev-exec repro build .#test-builds
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dev-exec $powerShellImage -NoProfile -File ../../tests/tools/vccexe/test.ps1 -WrapperPath ./vccexe-under-test.exe -EvidenceRoot ./evidence -TargetTriple x86_64-pc-windows-msvc
          exit $LASTEXITCODE
      - name: 'Preserve native wrapper evidence'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vccexe-paths-windows-x64
          path: ci/vccexe/evidence/**
          if-no-files-found: warn

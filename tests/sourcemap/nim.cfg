# Allow `import compiler/foo` in coverage-helper tests.
--path:"../../"

# The VM-trace tests read the traces they produce back with the CodeTracer
# trace-format library (and through it nim-stew and nim-results), the same
# copies the compiler is built against under `dist/`. The global
# `config/nim.cfg` does not put them on every compile's path, so this
# directory does. They are here rather than in each test's `matrix:` because
# testament runs a test's command through a shell, which expands `$lib` in a
# matrix entry to an empty string; a config file expands it to the stdlib.
# `$lib/../` rather than `$nim/` for the reason `tests/config.nims` gives.
--path:"$lib/../dist/codetracer-trace-format-nim/src"
--path:"$lib/../dist/nim-stew"
--path:"$lib/../dist/nim-results"

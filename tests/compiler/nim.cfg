# note: consider moving tests/compilerapi/ to tests/compiler/ since
# that's more predictable.

# note: without this, tests may succeed locally but fail on CI (it can succeed
# locally even when compiling via `./bin/nim` because `$HOME/.nimble` is being
# used).
--path:"../../" # so we can `import compiler/foo` in this dir
# Compiler modules that reach the VM (`nimeval`, `vm`, ...) import the
# CodeTracer trace-format library, nim-stew and nim-results, which the global
# `config/nim.cfg` does not put on every compile's path. `$lib/../` rather
# than `$nim/` for the reason `tests/config.nims` gives.
--path:"$lib/../dist/codetracer-trace-format-nim/src"
--path:"$lib/../dist/nim-stew"
--path:"$lib/../dist/nim-results"

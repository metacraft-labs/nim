# tcompilerapi imports the compiler's VM (`vm`, `nimeval`), whose tracer
# (`compiler/vm_trace.nim`) imports the CodeTracer trace-format library,
# nim-stew and nim-results. The global `config/nim.cfg` does not put them on
# every compile's path, so this directory lists them. `$lib/../` rather than
# `$nim/` for the reason `tests/config.nims` gives.
--path:"$lib/../dist/codetracer-trace-format-nim/src"
--path:"$lib/../dist/nim-stew"
--path:"$lib/../dist/nim-results"

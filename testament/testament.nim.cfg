# don't move this file without updating the logic in `isNimRepoTests`

path = "$nim" # For compiler/nodejs
-d:ssl # For azure
# my SSL doesn't have this feature and I don't care:
-d:nimDisableCertificateValidation
--warningAserror:ProveInit
--warningAserror:Uninit

# CTFS-M1: testament imports the CTFS materializer library directly
# (`codetracer_ct_print_lib` + `codetracer_trace_writer/new_trace_reader`).
# The compiler already imports the same library for vm_trace emission, so
# testament inherits the same dependency surface. The dist/ symlink at
# `$nim/dist/codetracer-trace-format-nim -> ../codetracer-trace-format-nim`
# codifies the sibling-repo path the Nix dev shell expects.
--path:"$nim/dist/codetracer-trace-format-nim/src"
--path:"$nim/dist/nim-stew"
--path:"$nim/dist/nim-results"
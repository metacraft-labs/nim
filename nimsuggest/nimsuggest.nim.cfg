# Special configuration file for the Nim project

# ORC, like the compiler binary: nimsuggest compiles the compiler's VM
# tracer, and the trace-format library it links defines destructors that
# only ARC/ORC accept.
mm:orc

hint[XDeclaredButNotUsed]:off

path:"$lib/packages/docutils"

define:useStdoutAsStdmsg
define:nimsuggest
define:nimcore

# die when nimsuggest uses more than 4GB:
@if cpu32:
  define:"nimMaxHeap=2000"
@else:
  define:"nimMaxHeap=4000"
@end

#define:useNodeIds
#define:booting
#define:noDocgen
--path:"$nim"
--threads:on
--warningAserror:ProveInit
--warningAserror:Uninit


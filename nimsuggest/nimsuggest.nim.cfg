# Special configuration file for the Nim project

# ORC, like the compiler binary: nimsuggest compiles the compiler's VM
# tracer, and the trace-format library it links defines destructors that
# only ARC/ORC accept.
mm:orc

hint[XDeclaredButNotUsed]:off

path:"$lib/packages/docutils"

define:useStdoutAsStdmsg
define:nimsuggest
define:nimcore

# die when nimsuggest uses more than 4GB:
@if cpu32:
  define:"nimMaxHeap=2000"
@else:
  define:"nimMaxHeap=4000"
@end

#define:useNodeIds
#define:booting
#define:noDocgen
--path:"$nim"
# nimsuggest links the compiler, whose VM tracer (`compiler/vm_trace.nim`)
# imports the CodeTracer trace-format library and, through it, nim-stew and
# nim-results. They sit in this tree's `dist/`, next to the compiler sources
# being compiled, and the global `config/nim.cfg` deliberately does not put
# them on every compile's path, so list them here as `compiler/nim.cfg` does.
--path:"$projectpath/../dist/codetracer-trace-format-nim/src"
--path:"$projectpath/../dist/nim-stew"
--path:"$projectpath/../dist/nim-results"
--threads:on
--warningAserror:ProveInit
--warningAserror:Uninit


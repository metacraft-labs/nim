# Special configuration file for the Nim project

hint[XDeclaredButNotUsed]:off

define:booting
define:nimcore
define:drnim

@if windows:
  cincludes: "$lib/wrappers/libffi/common"
@end

define:useStdoutAsStdmsg

--path: "../../nimz3/src"
--path: "../dist/nimz3/src"

# drnim links the compiler, whose VM tracer imports the CodeTracer
# trace-format library, nim-stew and nim-results from this tree's `dist/`.
# The global `config/nim.cfg` does not put them on every compile's path.
path="$projectpath/../dist/codetracer-trace-format-nim/src"
path="$projectpath/../dist/nim-stew"
path="$projectpath/../dist/nim-results"

#define:useNodeIds

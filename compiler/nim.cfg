# Special configuration file for the Nim project

hint[XDeclaredButNotUsed]:off

define:booting
define:nimcore
# define:nimPreviewSlimSystem
# CTFS bootstrap: nim-stew's endians2.nim uses bare `doAssert` without an
# `import std/assertions` guard, which breaks under slim-system. Turning
# off slim-system in the bootstrap leaves `doAssert` in `system`. The
# compiler modules that conditionally `import std/assertions` under
# `when defined(nimPreviewSlimSystem)` continue to compile because both
# paths now resolve to the same proc.
define:nimPreviewCstringConversion
define:nimPreviewProcConversion
define:nimPreviewRangeDefault
define:nimPreviewNonVarDestructor
define:nimPreviewCheckedClose
define:nimPreviewAsmSemSymbol
define:nimPreviewCStringComparisons
define:nimPreviewDuplicateModuleError

threads:off

#import:"$projectpath/testability"

# CTFS-M1: vm_trace.nim and vm_value_serializer.nim import the codetracer
# trace-format library, and through it nim-stew and nim-results, vendored
# under `dist/` next to the compiler sources. This file is the only config
# that puts them on the compiler build's search path: the global
# `config/nim.cfg` is read by every compile, so it must not list them (a
# project bringing its own nim-stew would see two copies). Other programs
# that link compiler modules list them in their own configs
# (`nimsuggest/nimsuggest.nim.cfg`, `drnim/nim.cfg`,
# `testament/testament.nim.cfg`, `tests/compiler/nim.cfg`, ...).
path="$projectpath/../dist/codetracer-trace-format-nim/src"
path="$projectpath/../dist/nim-stew"
path="$projectpath/../dist/nim-results"

@if windows:
  cincludes: "$lib/wrappers/libffi/common"
@end

define:useStdoutAsStdmsg

@if nimHasStyleChecks:
  styleCheck:error
@end


#define:useNodeIds
#gc:markAndSweep

@if nimHasWarningObservableStores:
  warning[ObservableStores]:off
@end


@if nimHasWarningAsError:
  warningAsError[GcUnsafe2]:on
@end

@if nimHasWarnUnnamedBreak:
  warningAserror[UnnamedBreak]:on
@end

@if nimHasWarnBareExcept:
  warning[BareExcept]:on
  warningAserror[BareExcept]:on
@end


@if nimUseStrictDefs:
  experimental:strictDefs
  warningAsError[Uninit]:on
  warningAsError[ProveInit]:on
@end

@if nimHasWarnStdPrefix:
  warning[StdPrefix]:on
  warningAsError[StdPrefix]:on
@end

@if nimHasVtables:
  experimental:vtables
@end

@if nimHasImplicitRangeConversion:
  warning[ImplicitRangeConversion]:off
@end
